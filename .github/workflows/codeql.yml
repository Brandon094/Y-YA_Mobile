name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "desarrollo", "produccion" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 🚀 PASO CRÍTICO: Crea el archivo google-services.json de forma segura
    # Esto inyecta el contenido del secreto sin corromper el formato JSON
    - name: Create Google Services JSON
      env:
        GOOGLE_SERVICES_DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: echo "$GOOGLE_SERVICES_DATA" > app/google-services.json

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'java-kotlin'
        queries: security-extended,security-and-quality

    # 🏗️ COMPILACIÓN: GitHub Actions construye la App para que CodeQL pueda analizarla
    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
