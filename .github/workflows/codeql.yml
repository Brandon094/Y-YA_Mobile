name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "desarrollo", "produccion" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 🚀 PASO CRÍTICO: Crea y valida el archivo google-services.json
    - name: Create and Validate Google Services JSON
      env:
        GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        mkdir -p app
        if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
          if echo "$GOOGLE_SERVICES_SECRET" | base64 --decode 2>/dev/null | jq empty 2>/dev/null; then
            echo "$GOOGLE_SERVICES_SECRET" | base64 --decode > app/google-services.json
          elif echo "$GOOGLE_SERVICES_SECRET" | jq empty 2>/dev/null; then
            echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
          else
            echo "::warning::El secreto GOOGLE_SERVICES_JSON no es JSON ni Base64 válido. Usando fallback..."
            cat << 'EOF' > app/google-services.json
        {
          "project_info": { "project_number": "000000000000", "project_id": "y-ya-dummy", "storage_bucket": "y-ya-dummy.appspot.com" },
          "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.bhplusplus.yaya" } }, "oauth_client": [], "api_key": [{ "current_key": "AIzaSyDummyKeySpecForCIBuilds000000000" }], "services": {} }],
          "configuration_version": "1"
        }
        EOF
          fi
        else
          echo "::warning::GOOGLE_SERVICES_JSON está vacío. Usando fallback para compilación en CI..."
          cat << 'EOF' > app/google-services.json
        {
          "project_info": { "project_number": "000000000000", "project_id": "y-ya-dummy", "storage_bucket": "y-ya-dummy.appspot.com" },
          "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.bhplusplus.yaya" } }, "oauth_client": [], "api_key": [{ "current_key": "AIzaSyDummyKeySpecForCIBuilds000000000" }], "services": {} }],
          "configuration_version": "1"
        }
        EOF
        fi

        echo "Validando app/google-services.json generado..."
        jq empty app/google-services.json

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'java-kotlin'
        queries: security-extended,security-and-quality

    # 🏗️ COMPILACIÓN: GitHub Actions construye la App para que CodeQL pueda analizarla
    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
